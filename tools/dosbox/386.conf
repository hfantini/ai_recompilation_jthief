# DOSBox-X as the slowest machine the DOS port supports: a 386DX-33 with no
# math coprocessor and a plain VGA card (no VESA). Run from the repository
# root after building the dos preset, with JWLTHIEF.EXE copied next to
# JTHIEF.EXE:
#
#   flatpak run com.dosbox_x.DOSBox-X -conf tools/dosbox/386.conf bin/release/JTHIEF.EXE

[dosbox]
machine = vgaonly
memsize = 4

[cpu]
cputype = 386
core = normal
cycles = fixed 7800
fpu = false
