# DOSBox-X close to the real machine the DOS port is tried on: a Celeron
# 500 (Pentium II class) with an SVGA card, booted to MS-DOS mode. Run from
# the repository root after building the dos preset, with JWLTHIEF.EXE
# copied next to JTHIEF.EXE:
#
#   flatpak run com.dosbox_x.DOSBox-X -conf tools/dosbox/p2.conf bin/release/JTHIEF.EXE

[dosbox]
machine = svga_s3
memsize = 64

[cpu]
cputype = pentium_ii
core = dynamic
cycles = max
